<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Grup — GrupAI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0B0E10; --surface:#141A1D; --line:#262E32; --text:#EDEAE3; --dim:#96A0A3; --teal:#38E1C6; --gold:#D8B168; }
  *{box-sizing:border-box;} body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;}
  a{color:inherit;}
  header{padding:18px 22px; border-bottom:1px solid var(--line);}
  .logo{font-family:'Fraunces',serif; font-weight:700; font-size:1.2rem; text-decoration:none;}
  .logo span{color:var(--gold);}
  main{max-width:560px; margin:0 auto; padding:22px;}
  .hero-img{width:100%; aspect-ratio:1.8; object-fit:cover; border-radius:14px; background:#000; margin-bottom:16px;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:.68rem; color:var(--teal);}
  h1{font-family:'Fraunces',serif; font-size:1.5rem; margin:8px 0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .verified{display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; border-radius:99px; background:#3B9DF2; color:#fff; font-size:.65rem;}
  p.desc{color:var(--dim); font-size:.92rem; line-height:1.6;}
  .stars{display:inline-flex; gap:3px; margin:10px 0;}
  .stars .star{color:var(--line); font-size:1.4rem; cursor:pointer;}
  .stars .star.on{color:var(--gold);}
  .btn{display:block; width:100%; text-align:center; padding:13px; border-radius:10px; font-weight:600; margin-top:10px; text-decoration:none; font-family:'Inter',sans-serif;}
  .btn-join{background:var(--teal); color:#04211B;}
  .btn-wa{background:#25D366; color:#062B14;}
  .btn-contact{background:var(--gold); color:#241a05;}
  .spinner{font-family:'JetBrains Mono',monospace; color:var(--teal); text-align:center; padding:40px;}
</style>
</head>
<body>

<header><a href="index.html" class="logo">Grup<span>AI</span></a></header>

<main id="mainArea"><div class="spinner">Memuat...</div></main>

<script type="module">
import { initializeApp } from "https://cdn.jsdelivr.net/npm/firebase@10.12.0/app/+esm";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://cdn.jsdelivr.net/npm/firebase@10.12.0/auth/+esm";
import { getFirestore, doc, getDoc, collection, getDocs, setDoc } from "https://cdn.jsdelivr.net/npm/firebase@10.12.0/firestore/+esm";

const firebaseConfig = {
  apiKey: "AIzaSyDabShBKh-VO0nFtyjeiQuMUZ7-YScrajc",
  authDomain: "itemdrop-marketplace.firebaseapp.com",
  projectId: "itemdrop-marketplace",
  storageBucket: "itemdrop-marketplace.firebasestorage.app",
  messagingSenderId: "1019572855068",
  appId: "1:1019572855068:web:ef886624def992fbcd1ad9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;
const gid = new URLSearchParams(location.search).get('id');
const mainArea = document.getElementById('mainArea');

onAuthStateChanged(auth, user => { currentUser = user; });
window.doLogin = () => signInWithPopup(auth, new GoogleAuthProvider());

async function load(){
  if(!gid){ mainArea.innerHTML = '<p>Grup tidak ditemukan.</p>'; return; }
  const snap = await getDoc(doc(db,'groups',gid));
  if(!snap.exists()){ mainArea.innerHTML = '<p>Grup tidak ditemukan atau belum disetujui.</p>'; return; }
  const g = snap.data();
  const rSnap = await getDocs(collection(db,'groups',gid,'ratings'));
  const values = rSnap.docs.map(r=>r.data().value);
  const avg = values.length ? values.reduce((a,b)=>a+b,0)/values.length : 0;

  const titleColor = g.premium && g.nameColor ? `style="color:${g.nameColor}"` : '';
  let stars = '<div class="stars">';
  for(let n=1;n<=5;n++) stars += `<span class="star ${n<=Math.round(avg)?'on':''}" onclick="window.rate(${n})">★</span>`;
  stars += `</div><span style="color:var(--dim); font-size:.8rem;">${avg.toFixed(1)} dari ${values.length} vote</span>`;

  mainArea.innerHTML = `
    ${g.imageUrl ? `<img class="hero-img" src="${g.imageUrl}">` : ''}
    <span class="tag">${g.platform} · ${g.category}</span>
    <h1 ${titleColor}>${g.title} ${g.verified?'<span class="verified">✓</span>':''} ${g.premium?'👑':''}</h1>
    <p class="desc">${g.desc||''}</p>
    ${stars}
    <a class="btn btn-join" target="_blank" href="${g.link}">🚀 Gabung Grup</a>
    <a class="btn btn-wa" target="_blank" href="${g.link}">💬 Buka di ${g.platform||'Chat'}</a>
    ${g.adminContact ? `<a class="btn btn-contact" target="_blank" href="https://wa.me/${g.adminContact}?text=${encodeURIComponent('Halo, saya mau tanya soal grup: '+g.title)}">📩 Kontak Admin Grup</a>` : ''}
  `;

  window.rate = async (n) => {
    if(!currentUser){ if(confirm('Login dulu buat kasih rating. Login sekarang?')) window.doLogin(); return; }
    await setDoc(doc(db,'groups',gid,'ratings',currentUser.uid), { value:n });
    load();
  };
}
load();
</script>
</body>
</html>
