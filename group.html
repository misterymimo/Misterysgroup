<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Grup — Mistygrou</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0D0C0A; --surface:#17140F; --line:#2B2620; --text:#F1ECE1; --dim:#9C9488; --brass:#C9A24B; --forest:#3FAE7A; }
  *{box-sizing:border-box;} body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;}
  a{color:inherit;}
  header{padding:18px 22px; border-bottom:1px solid var(--line);}
  .logo{font-family:'Fraunces',serif; font-weight:700; font-size:1.2rem; text-decoration:none;}
  .logo span{color:var(--brass);}
  main{max-width:560px; margin:0 auto; padding:22px;}
  .hero-img{width:100%; aspect-ratio:1.8; object-fit:cover; border-radius:14px; background:#000; margin-bottom:16px;}
  .tag-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:.68rem; color:var(--forest); background:rgba(63,174,122,.1); padding:3px 8px; border-radius:6px;}
  .tag.theme{color:var(--brass); background:rgba(201,162,75,.12);}
  h1{font-family:'Fraunces',serif; font-size:1.5rem; margin:8px 0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .badge-verified{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:99px; background:#3B7DD8;}
  p.desc{color:var(--dim); font-size:.92rem; line-height:1.6;}
  .stars{display:inline-flex; gap:3px; margin:10px 0;}
  .stars .star{color:var(--line); font-size:1.4rem; cursor:pointer;}
  .stars .star.on{color:var(--brass);}
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; text-align:center; padding:13px; border-radius:10px; font-weight:600; margin-top:10px; text-decoration:none; font-family:'Inter',sans-serif;}
  .btn-join{background:var(--forest); color:#04170D;}
  .btn-wa{background:#25D366; color:#062B14;}
  .spinner{font-family:'JetBrains Mono',monospace; color:var(--forest); text-align:center; padding:40px;}


  /* ===== Tema VIP: Bubble Glass ===== */
.vip-page *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
.vip-page{
    --bg:#050505;
    --white:#ffffff;
    --glass:rgba(255,255,255,.075);
    --glass2:rgba(255,255,255,.045);
    --line:rgba(255,255,255,.14);
    --muted:rgba(255,255,255,.55);
}
.vip-page{
    scroll-behavior:smooth;
}
.vip-page{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
    background:
        radial-gradient(circle at 20% 10%,rgba(255,255,255,.10),transparent 25%),
        radial-gradient(circle at 85% 25%,rgba(255,255,255,.07),transparent 25%),
        radial-gradient(circle at 50% 100%,rgba(255,255,255,.06),transparent 30%),
        #050505;
    overflow-x:hidden;
}
.vip-page .grid{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.16;
    background-image:
        linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
    background-size:50px 50px;
    mask-image:linear-gradient(to bottom,black,transparent);
}
.vip-page .bubble{
    position:fixed;
    border-radius:50%;
    pointer-events:none;
    border:1px solid rgba(255,255,255,.13);
    background:
        radial-gradient(
            circle at 30% 25%,
            rgba(255,255,255,.20),
            rgba(255,255,255,.025) 45%,
            transparent 70%
        );
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
}
.vip-page .bubble1{
    width:220px;
    height:220px;
    left:-100px;
    top:18%;
    animation:vfloat1 10s ease-in-out infinite;
}
.vip-page .bubble2{
    width:140px;
    height:140px;
    right:5%;
    top:20%;
    animation:vfloat2 8s ease-in-out infinite;
}
.vip-page .bubble3{
    width:300px;
    height:300px;
    right:-150px;
    bottom:-80px;
    animation:vfloat3 13s ease-in-out infinite;
}
@keyframes vfloat1{
    0%,100%{
        transform:translate(0,0);
    }
    50%{
        transform:translate(60px,-45px);
    }
}
@keyframes vfloat2{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(60px);
    }
}
@keyframes vfloat3{
    0%,100%{
        transform:translate(0,0);
    }
    50%{
        transform:translate(-50px,-60px);
    }
}
.vip-page .navbar{
    position:sticky;
    top:0;
    z-index:100;
    height:72px;

    background:rgba(0,0,0,.42);
    border-bottom:1px solid rgba(255,255,255,.10);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
}
.vip-page .nav{
    max-width:1150px;
    height:100%;
    margin:auto;
    padding:0 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}
.vip-page .logo{
    display:flex;
    align-items:center;
    gap:11px;

    font-size:16px;
    font-weight:800;
}
.vip-page .logo-box{
    width:39px;
    height:39px;
    border-radius:13px;

    display:grid;
    place-items:center;

    background:rgba(255,255,255,.10);
    border:1px solid rgba(255,255,255,.18);

    box-shadow:
        inset 0 1px rgba(255,255,255,.22),
        0 8px 30px rgba(0,0,0,.3);
}
.vip-page .logo-box svg{
    width:21px;
    fill:white;
}
.vip-page .nav-btn{text-decoration:none; display:inline-block;
    padding:10px 14px;
    border-radius:11px;

    border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.055);

    color:white;
    font-size:11px;
    font-weight:700;

    cursor:pointer;
    transition:.25s;
}
.vip-page .nav-btn:hover{
    background:rgba(255,255,255,.12);
    transform:translateY(-2px);
}
.vip-page .container{
    max-width:1150px;
    margin:auto;
    padding:40px 20px 75px;
}
.vip-page .breadcrumb{
    color:rgba(255,255,255,.35);
    font-size:11px;
    margin-bottom:22px;
}
.vip-page .breadcrumb span{
    color:rgba(255,255,255,.70);
}
.vip-page .glass{
    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.095),
            rgba(255,255,255,.035)
        );

    border:1px solid rgba(255,255,255,.13);

    box-shadow:
        0 25px 80px rgba(0,0,0,.40),
        inset 0 1px rgba(255,255,255,.12);

    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);

    overflow:hidden;
}
.vip-page .glass::before{
    content:"";
    position:absolute;
    top:0;
    left:12%;
    right:12%;
    height:1px;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.45),
        transparent
    );

    opacity:.7;
}
.vip-page .hero{
    display:grid;
    grid-template-columns:1fr 330px;
    gap:17px;

    animation:vappear .7s ease both;
}
@keyframes vappear{
    from{
        opacity:0;
        transform:translateY(20px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}
.vip-page .profile{
    min-height:380px;
    border-radius:26px;
    padding:32px;
}
.vip-page .profile-content{
    position:relative;
    z-index:2;
}
.vip-page .profile-head{
    display:flex;
    align-items:center;
    gap:20px;
}
.vip-page .group-logo{
    width:95px;
    height:95px;
    flex-shrink:0;

    border-radius:29px;

    display:grid;
    place-items:center;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.20),
            rgba(255,255,255,.045)
        );

    border:1px solid rgba(255,255,255,.18);

    box-shadow:
        inset 0 2px 5px rgba(255,255,255,.16),
        inset 0 -15px 30px rgba(0,0,0,.15),
        0 20px 45px rgba(0,0,0,.35);

    animation:vlogoFloat 5s ease-in-out infinite;
}
.vip-page .group-logo svg{
    width:48px;
    fill:white;
    opacity:.92;
    filter:drop-shadow(0 5px 10px rgba(255,255,255,.15));
}
@keyframes vlogoFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-7px);
    }
}
.vip-page .status{
    display:inline-flex;
    align-items:center;
    gap:7px;

    padding:6px 10px;
    border-radius:50px;

    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.10);

    color:rgba(255,255,255,.65);

    font-size:9px;
    font-weight:800;

    margin-bottom:9px;
}
.vip-page .status-dot{
    width:6px;
    height:6px;
    border-radius:50%;

    background:#fff;

    box-shadow:
        0 0 8px rgba(255,255,255,.9);

    animation:vpulse 1.8s infinite;
}
@keyframes vpulse{
    50%{
        opacity:.35;
    }
}
.vip-page .title{
    font-size:34px;
    line-height:1.05;
    letter-spacing:-1.5px;
    font-weight:900;
}
.vip-page .description{
    margin-top:14px;

    max-width:650px;

    color:var(--muted);

    font-size:13px;
    line-height:1.8;
}
.vip-page .tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;

    margin-top:23px;
}
.vip-page .tag{
    padding:8px 11px;

    border-radius:10px;

    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.09);

    color:rgba(255,255,255,.60);

    font-size:10px;
}
.vip-page .profile-bottom{
    position:absolute;
    bottom:25px;
    left:32px;
    right:32px;

    padding-top:17px;

    border-top:1px solid rgba(255,255,255,.07);

    display:flex;
    justify-content:space-between;

    color:rgba(255,255,255,.40);
    font-size:10px;
}
.vip-page .join{
    min-height:380px;
    border-radius:26px;
    padding:27px;

    display:flex;
    flex-direction:column;
    justify-content:center;
}
.vip-page .small-title{
    color:rgba(255,255,255,.37);
    font-size:9px;
    letter-spacing:1.3px;
    font-weight:800;
}
.vip-page .join h2{
    margin-top:9px;

    font-size:21px;
    letter-spacing:-.5px;
}
.vip-page .join p{
    margin-top:9px;

    color:rgba(255,255,255,.47);
    font-size:11px;
    line-height:1.7;
}
.vip-page .primary{
    position:relative;
    overflow:hidden;

    width:100%;
    margin-top:21px;

    padding:15px;

    border:1px solid rgba(255,255,255,.22);
    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.20),
            rgba(255,255,255,.07)
        );

    color:white;

    font-size:11px;
    font-weight:800;

    cursor:pointer;

    box-shadow:
        inset 0 1px rgba(255,255,255,.20),
        0 12px 35px rgba(0,0,0,.25);

    transition:.25s;
}
.vip-page .primary::after{
    content:"";

    position:absolute;
    top:0;
    left:-100%;

    width:45%;
    height:100%;

    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
    );

    transform:skewX(-20deg);
}
.vip-page .primary:hover::after{
    animation:vshine .8s ease;
}
@keyframes vshine{
    from{
        left:-100%;
    }

    to{
        left:140%;
    }
}
.vip-page .primary:hover{
    transform:translateY(-3px);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.25),
            rgba(255,255,255,.09)
        );

    box-shadow:
        inset 0 1px rgba(255,255,255,.25),
        0 18px 45px rgba(0,0,0,.35);
}
.vip-page .secondary{
    width:100%;
    margin-top:9px;

    padding:13px;

    border-radius:12px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.09);

    color:rgba(255,255,255,.70);

    font-size:10px;
    font-weight:700;

    cursor:pointer;
    transition:.25s;
}
.vip-page .secondary:hover{
    background:rgba(255,255,255,.09);
    color:white;
}
.vip-page .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;

    margin-top:17px;
}
.vip-page .stat{
    border-radius:17px;
    padding:18px;

    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.09);

    box-shadow:
        inset 0 1px rgba(255,255,255,.07);

    transition:.25s;
}
.vip-page .stat:hover{
    transform:translateY(-4px);
    background:rgba(255,255,255,.075);
    border-color:rgba(255,255,255,.18);
}
.vip-page .stat-label{
    color:rgba(255,255,255,.34);
    font-size:8px;
    font-weight:800;
    letter-spacing:1px;

    margin-bottom:8px;
}
.vip-page .stat-value{
    font-size:18px;
    font-weight:900;
}
.vip-page .content{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:17px;

    margin-top:17px;
}
.vip-page .section{
    border-radius:23px;
    padding:23px;
}
.vip-page .section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:17px;
}
.vip-page .section-head h2{
    font-size:14px;
}
.vip-page .section-head span{
    color:rgba(255,255,255,.28);
    font-size:8px;
    letter-spacing:1px;
}
.vip-page .menu{
    display:flex;
    flex-direction:column;
    gap:9px;
}
.vip-page .menu-item{
    display:flex;
    align-items:center;
    gap:13px;

    padding:13px;

    border-radius:14px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.065);

    cursor:pointer;

    transition:.25s;
}
.vip-page .menu-item:hover{
    transform:translateX(5px);
    background:rgba(255,255,255,.075);
    border-color:rgba(255,255,255,.16);
}
.vip-page .icon{
    width:42px;
    height:42px;

    border-radius:12px;

    display:grid;
    place-items:center;

    background:rgba(255,255,255,.065);
    border:1px solid rgba(255,255,255,.09);
}
.vip-page .icon svg{
    width:20px;
    height:20px;

    fill:none;
    stroke:white;
    stroke-width:1.6;

    opacity:.8;
}
.vip-page .menu-text{
    flex:1;
}
.vip-page .menu-text strong{
    display:block;
    font-size:11px;
    margin-bottom:4px;
}
.vip-page .menu-text small{
    color:rgba(255,255,255,.35);
    font-size:9px;
}
.vip-page .arrow{
    color:rgba(255,255,255,.25);
    font-size:20px;
}
.vip-page .info{
    display:flex;
    flex-direction:column;
    gap:8px;
}
.vip-page .info-row{
    display:flex;
    justify-content:space-between;

    padding:12px 13px;

    border-radius:11px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.055);
}
.vip-page .info-row span:first-child{
    color:rgba(255,255,255,.30);
    font-size:9px;
}
.vip-page .info-row span:last-child{
    color:rgba(255,255,255,.75);
    font-size:9px;
    font-weight:700;
}
.vip-page .notice{
    margin-top:12px;

    padding:14px;

    border-radius:12px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.07);

    color:rgba(255,255,255,.36);

    font-size:9px;
    line-height:1.7;
}
.vip-page footer{
    max-width:1150px;
    margin:auto;

    padding:23px 20px 35px;

    border-top:1px solid rgba(255,255,255,.07);

    display:flex;
    justify-content:space-between;

    color:rgba(255,255,255,.24);
    font-size:9px;
}
@keyframes vmodalIn{
    from{
        opacity:0;
        transform:scale(.93) translateY(15px);
    }

    to{
        opacity:1;
        transform:none;
    }
}
@media(max-width:820px){.vip-page .hero,
.vip-page .content{
        grid-template-columns:1fr;
    }
.vip-page .stats{
        grid-template-columns:repeat(2,1fr);
    }
}
@media(max-width:550px){.vip-page .container{
        padding:27px 13px 60px;
    }
.vip-page .profile{
        padding:20px;
        min-height:400px;
    }
.vip-page .profile-head{
        align-items:flex-start;
        gap:13px;
    }
.vip-page .group-logo{
        width:70px;
        height:70px;
        border-radius:20px;
    }
.vip-page .group-logo svg{
        width:36px;
    }
.vip-page .title{
        font-size:23px;
        letter-spacing:-1px;
    }
.vip-page .description{
        font-size:11px;
    }
.vip-page .profile-bottom{
        left:20px;
        right:20px;
    }
.vip-page .join{
        min-height:320px;
    }
.vip-page footer{
        flex-direction:column;
        gap:7px;
    }
}
@media(max-width:370px){.vip-page .logo span{
        display:none;
    }
.vip-page .title{
        font-size:20px;
    }
}

.vip-page{min-height:100vh; position:relative;}
.vip-page a{text-decoration:none; color:inherit;}
.vip-page a.primary,.vip-page a.secondary{display:block; text-align:center;}
.vip-page .group-logo img{width:100%; height:100%; object-fit:cover; border-radius:inherit;}
.vip-page .group-logo{overflow:hidden;}
.vip-page .v-badge{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:99px; background:#3B7DD8; vertical-align:middle; margin-left:6px;}
.vip-page .v-stars{display:flex; gap:4px; align-items:center;}
.vip-page .v-stars .star{color:rgba(255,255,255,.2); font-size:1.15rem; cursor:pointer;}
.vip-page .v-stars .star.on{color:#fff; text-shadow:0 0 10px rgba(255,255,255,.5);}
.vip-page .profile-bottom{position:static; margin-top:28px;}

  /* ===== Tema Basic / Premium / Zamrud ===== */
.t-basic *{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
.t-basic{
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
  background: #ffffff;
  color: #222;
  padding: 25px 15px 50px;
}
.t-basic .container{
  width: min(1100px, 100%);
  margin: auto;
}
.t-basic .header{
  text-align: center;
  margin-bottom: 35px;
}
.t-basic .logo{
  width: 78px;
  height: 78px;
  margin: auto;
  border-radius: 24px;

  background: rgba(255,255,255,.55);

  border: 1px solid rgba(255,255,255,.9);

  box-shadow:
    0 12px 30px rgba(90,90,90,.14),
    inset 0 2px 0 rgba(255,255,255,.95),
    inset 0 -2px 0 rgba(170,170,170,.08);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 36px;
}
.t-basic .header h1{
  margin-top: 16px;
  font-size: 29px;
  font-weight: 800;
  letter-spacing: -.5px;
}
.t-basic .header p{
  margin-top: 8px;
  color: #777;
  font-size: 14px;
}
.t-basic .water-panel{
  position: relative;
  overflow: hidden;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.58),
      rgba(245,245,245,.28)
    );

  border: 1px solid rgba(255,255,255,.92);

  box-shadow:
    0 18px 40px rgba(80,80,80,.13),
    0 4px 10px rgba(100,100,100,.07),
    inset 0 2px 0 rgba(255,255,255,.9),
    inset 0 -2px 0 rgba(170,170,170,.08);

  border-radius: 24px;
}
.t-basic .water-panel::before{
  content: "";
  position: absolute;
  top: 0;
  left: 7%;
  width: 42%;
  height: 1px;

  background: rgba(255,255,255,.95);

  border-radius: 100%;

  box-shadow:
    0 0 12px rgba(255,255,255,.7);
}
.t-basic .water-panel::after{
  content: "";
  position: absolute;
  left: 15%;
  right: 15%;
  bottom: -12px;
  height: 22px;

  background: rgba(100,100,100,.08);

  filter: blur(10px);
  border-radius: 50%;
  z-index: -1;
}
.t-basic .hero{
  padding: 35px 25px;
  text-align: center;
  margin-bottom: 22px;
}
.t-basic .hero h2{
  font-size: 25px;
  margin-bottom: 10px;
}
.t-basic .hero p{
  color: #666;
  line-height: 1.6;
  font-size: 14px;
}
.t-basic .menu{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-bottom: 22px;
}
.t-basic .card{
  position: relative;
  padding: 25px 20px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.58),
      rgba(242,242,242,.25)
    );

  border: 1px solid rgba(255,255,255,.9);

  border-radius: 20px;

  box-shadow:
    0 14px 32px rgba(70,70,70,.11),
    0 3px 8px rgba(70,70,70,.06),
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(170,170,170,.08);

  transition:
    transform .25s ease,
    box-shadow .25s ease;
}
.t-basic .card:hover{
  transform: translateY(-4px);

  box-shadow:
    0 20px 38px rgba(70,70,70,.15),
    0 5px 10px rgba(70,70,70,.08),
    inset 0 1px 0 rgba(255,255,255,1);
}
.t-basic .card-icon{
  width: 52px;
  height: 52px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 15px;

  background: rgba(255,255,255,.45);

  border: 1px solid rgba(255,255,255,.85);

  box-shadow:
    0 7px 16px rgba(90,90,90,.1),
    inset 0 1px 0 rgba(255,255,255,.9);

  font-size: 24px;
  margin-bottom: 17px;
}
.t-basic .card h3{
  font-size: 18px;
  margin-bottom: 8px;
}
.t-basic .card p{
  font-size: 13px;
  line-height: 1.6;
  color: #707070;
}
.t-basic .section-title{
  margin: 35px 5px 15px;
}
.t-basic .section-title h2{
  font-size: 22px;
}
.t-basic .section-title p{
  color: #777;
  font-size: 13px;
  margin-top: 5px;
}
.t-basic .groups{
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 17px;
}
.t-basic .group{
  display: flex;
  align-items: center;
  gap: 15px;

  padding: 18px;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.55),
      rgba(240,240,240,.22)
    );

  border: 1px solid rgba(255,255,255,.9);

  border-radius: 19px;

  box-shadow:
    0 12px 28px rgba(80,80,80,.10),
    inset 0 1px 0 rgba(255,255,255,.9);

  transition: .25s ease;
}
.t-basic .group:hover{
  transform: translateY(-3px);
  box-shadow:
    0 17px 32px rgba(80,80,80,.14),
    inset 0 1px 0 rgba(255,255,255,.95);
}
.t-basic .group-logo{
  flex-shrink: 0;

  width: 58px;
  height: 58px;

  border-radius: 17px;

  background: rgba(255,255,255,.5);

  border: 1px solid rgba(255,255,255,.9);

  box-shadow:
    0 7px 16px rgba(80,80,80,.1),
    inset 0 1px 0 rgba(255,255,255,.95);

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 25px;
}
.t-basic .group-info{
  flex: 1;
}
.t-basic .group-info h3{
  font-size: 16px;
  margin-bottom: 5px;
}
.t-basic .group-info p{
  font-size: 12px;
  color: #777;
}
.t-basic .join-btn{
  border: 0;
  padding: 10px 15px;

  border-radius: 12px;

  background: rgba(255,255,255,.65);

  color: #222;

  border: 1px solid rgba(255,255,255,.9);

  box-shadow:
    0 6px 13px rgba(70,70,70,.10),
    inset 0 1px 0 rgba(255,255,255,.95);

  cursor: pointer;
  font-weight: 700;

  transition: .2s ease;
}
.t-basic .join-btn:hover{
  transform: scale(1.04);
  background: #fff;
}
.t-basic .admin{
  margin-top: 22px;
  padding: 28px;
  text-align: center;
}
.t-basic .admin h2{
  font-size: 21px;
  margin-bottom: 8px;
}
.t-basic .admin p{
  color: #707070;
  font-size: 13px;
  margin-bottom: 18px;
}
.t-basic .admin-btn{
  display: inline-block;

  text-decoration: none;
  color: #222;

  padding: 12px 20px;

  border-radius: 14px;

  background: rgba(255,255,255,.7);

  border: 1px solid rgba(255,255,255,.95);

  box-shadow:
    0 8px 18px rgba(70,70,70,.12),
    inset 0 1px 0 rgba(255,255,255,1);

  font-weight: 700;

  transition: .2s ease;
}
.t-basic .admin-btn:hover{
  transform: translateY(-2px);
}
.t-basic footer{
  text-align: center;
  margin-top: 35px;

  color: #999;
  font-size: 12px;
}
@media (max-width: 750px){.t-basic{
    padding: 18px 12px 40px;
  }
.t-basic .menu{
    grid-template-columns: 1fr;
  }
.t-basic .groups{
    grid-template-columns: 1fr;
  }
.t-basic .hero{
    padding: 28px 20px;
  }
.t-basic .hero h2{
    font-size: 22px;
  }
.t-basic .group{
    padding: 15px;
  }
.t-basic .join-btn{
    padding: 9px 12px;
    font-size: 12px;
  }
}
.t-prem{
    --bg:#07060d;
    --bg2:#0d0a18;
    --card:rgba(20,17,32,.68);
    --card2:rgba(25,21,42,.72);
    --line:rgba(255,255,255,.09);
    --text:#f8f7ff;
    --muted:#9993ab;

    --purple:#8b5cf6;
    --violet:#a855f7;
    --cyan:#22d3ee;
    --pink:#ec4899;
    --green:#25d366;
}
.t-prem *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}
.t-prem{
    scroll-behavior:smooth;
}
.t-prem{
    font-family:Inter,Arial,sans-serif;
    color:var(--text);
    background:
        radial-gradient(circle at 50% -15%,rgba(139,92,246,.25),transparent 35%),
        radial-gradient(circle at 100% 30%,rgba(34,211,238,.10),transparent 28%),
        radial-gradient(circle at 0% 80%,rgba(236,72,153,.09),transparent 28%),
        var(--bg);
    min-height:100vh;
    overflow-x:hidden;
}
.t-prem .bg-grid{
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.20;
    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:55px 55px;
    mask-image:linear-gradient(to bottom,black,transparent 90%);
}
.t-prem .orb{
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    pointer-events:none;
    opacity:.35;
    z-index:-1;
}
.t-prem .orb.one{
    width:260px;
    height:260px;
    background:#7c3aed;
    top:15%;
    left:-100px;
    animation:kp_floatOne 9s ease-in-out infinite;
}
.t-prem .orb.two{
    width:230px;
    height:230px;
    background:#06b6d4;
    right:-80px;
    top:45%;
    animation:kp_floatTwo 11s ease-in-out infinite;
}
.t-prem .orb.three{
    width:190px;
    height:190px;
    background:#db2777;
    left:35%;
    bottom:-100px;
    animation:kp_floatThree 12s ease-in-out infinite;
}
@keyframes kp_floatOne{
    0%,100%{transform:translate(0,0)}
    50%{transform:translate(80px,50px)}
}
@keyframes kp_floatTwo{
    0%,100%{transform:translate(0,0)}
    50%{transform:translate(-70px,-60px)}
}
@keyframes kp_floatThree{
    0%,100%{transform:translate(0,0)}
    50%{transform:translate(40px,-70px)}
}
.t-prem .navbar{
    height:76px;
    position:sticky;
    top:0;
    z-index:100;
    border-bottom:1px solid rgba(255,255,255,.07);
    background:rgba(7,6,13,.65);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
}
.t-prem .nav-inner{
    max-width:1180px;
    height:100%;
    margin:auto;
    padding:0 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.t-prem .logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:900;
    letter-spacing:-.7px;
}
.t-prem .logo-icon{
    width:40px;
    height:40px;
    border-radius:13px;
    display:grid;
    place-items:center;
    background:
        linear-gradient(135deg,var(--purple),var(--pink));
    box-shadow:
        0 0 25px rgba(139,92,246,.30),
        inset 0 1px rgba(255,255,255,.35);
}
.t-prem .logo-icon svg{
    width:21px;
    fill:white;
}
.t-prem .logo span{
    font-size:17px;
}
.t-prem .logo em{
    color:#a78bfa;
    font-style:normal;
}
.t-prem .nav-actions{
    display:flex;
    gap:9px;
}
.t-prem .nav-button{
    border:1px solid var(--line);
    background:rgba(255,255,255,.045);
    color:white;
    padding:10px 15px;
    border-radius:11px;
    cursor:pointer;
    font-size:12px;
    font-weight:700;
    transition:.25s;
}
.t-prem .nav-button:hover{
    background:rgba(139,92,246,.13);
    border-color:rgba(139,92,246,.35);
    transform:translateY(-2px);
}
.t-prem .container{
    max-width:1180px;
    margin:auto;
    padding:42px 20px 80px;
}
.t-prem .breadcrumb{
    color:#716b80;
    font-size:12px;
    margin-bottom:25px;
}
.t-prem .breadcrumb span{
    color:#bbb3c9;
}
.t-prem .hero{
    display:grid;
    grid-template-columns:1fr 350px;
    gap:18px;
    animation:kp_pageIn .7s ease both;
}
@keyframes kp_pageIn{
    from{
        opacity:0;
        transform:translateY(18px);
    }
    to{
        opacity:1;
        transform:none;
    }
}
.t-prem .glass{
    background:
        linear-gradient(
            145deg,
            rgba(31,26,49,.76),
            rgba(13,11,22,.76)
        );
    border:1px solid var(--line);
    border-radius:25px;
    box-shadow:
        0 25px 80px rgba(0,0,0,.27),
        inset 0 1px rgba(255,255,255,.045);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
}
.t-prem .profile{
    min-height:390px;
    padding:32px;
    position:relative;
    overflow:hidden;
}
.t-prem .profile::before{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    right:-120px;
    top:-120px;
    border-radius:50%;
    background:rgba(139,92,246,.14);
    filter:blur(10px);
}
.t-prem .profile::after{
    content:"";
    position:absolute;
    width:140px;
    height:140px;
    left:-70px;
    bottom:-70px;
    border-radius:50%;
    background:rgba(34,211,238,.08);
    filter:blur(10px);
}
.t-prem .profile-content{
    position:relative;
    z-index:2;
}
.t-prem .profile-head{
    display:flex;
    align-items:center;
    gap:21px;
}
.t-prem .group-logo{
    width:100px;
    height:100px;
    flex-shrink:0;
    border-radius:29px;
    display:grid;
    place-items:center;
    background:
        radial-gradient(circle at 30% 20%,#c4b5fd,transparent 13%),
        linear-gradient(145deg,#7c3aed,#c026d3);
    box-shadow:
        0 18px 45px rgba(124,58,237,.32),
        inset 0 1px rgba(255,255,255,.45);
    animation:kp_logoFloat 4s ease-in-out infinite;
}
@keyframes kp_logoFloat{
    0%,100%{transform:translateY(0) rotate(0)}
    50%{transform:translateY(-6px) rotate(1deg)}
}
.t-prem .group-logo svg{
    width:50px;
    fill:white;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.25));
}
.t-prem .badge{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 10px;
    border-radius:999px;
    background:rgba(37,211,102,.08);
    border:1px solid rgba(37,211,102,.17);
    color:#68ee99;
    font-size:10px;
    font-weight:800;
    margin-bottom:10px;
}
.t-prem .badge-dot{
    width:6px;
    height:6px;
    background:#25d366;
    border-radius:50%;
    box-shadow:0 0 10px #25d366;
    animation:kp_pulse 1.8s infinite;
}
@keyframes kp_pulse{
    0%,100%{box-shadow:0 0 5px #25d366}
    50%{box-shadow:0 0 15px #25d366}
}
.t-prem .title{
    font-size:36px;
    line-height:1.05;
    letter-spacing:-1.7px;
    font-weight:900;
}
.t-prem .title span{
    background:linear-gradient(90deg,#c4b5fd,#67e8f9,#f0abfc);
    -webkit-background-clip:text;
    color:transparent;
    background-size:200% auto;
    animation:kp_gradientMove 4s linear infinite;
}
@keyframes kp_gradientMove{
    to{background-position:200% center}
}
.t-prem .description{
    max-width:650px;
    color:var(--muted);
    line-height:1.75;
    font-size:13px;
    margin-top:14px;
}
.t-prem .tags{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:25px;
}
.t-prem .tag{
    padding:8px 11px;
    border:1px solid rgba(255,255,255,.07);
    background:rgba(255,255,255,.035);
    border-radius:10px;
    color:#bcb6c9;
    font-size:10px;
    font-weight:600;
}
.t-prem .hero-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:42px;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,.06);
}
.t-prem .online{
    display:flex;
    align-items:center;
    gap:9px;
    color:#aaa2b5;
    font-size:11px;
}
.t-prem .online i{
    width:8px;
    height:8px;
    background:#25d366;
    border-radius:50%;
}
.t-prem .join-card{
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
    overflow:hidden;
}
.t-prem .join-card::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    background:#8b5cf6;
    opacity:.09;
    border-radius:50%;
    right:-100px;
    top:-100px;
    filter:blur(10px);
}
.t-prem .join-label{
    font-size:10px;
    font-weight:800;
    color:#8e879d;
    letter-spacing:1.2px;
    margin-bottom:9px;
}
.t-prem .join-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:8px;
}
.t-prem .join-desc{
    color:var(--muted);
    font-size:12px;
    line-height:1.65;
    margin-bottom:21px;
}
.t-prem .primary{
    position:relative;
    overflow:hidden;
    border:0;
    padding:15px;
    border-radius:13px;
    background:linear-gradient(100deg,#7c3aed,#a855f7,#ec4899);
    background-size:200% auto;
    color:white;
    font-weight:800;
    font-size:12px;
    cursor:pointer;
    box-shadow:0 13px 35px rgba(139,92,246,.25);
    transition:.25s;
}
.t-prem .primary::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:50%;
    height:100%;
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.35),
        transparent
    );
    transform:skewX(-20deg);
    transition:.7s;
}
.t-prem .primary:hover::before{
    left:130%;
}
.t-prem .primary:hover{
    transform:translateY(-3px);
    box-shadow:0 18px 45px rgba(139,92,246,.35);
}
.t-prem .secondary{
    border:1px solid var(--line);
    padding:13px;
    border-radius:12px;
    background:rgba(255,255,255,.035);
    color:#d9d4e2;
    font-weight:700;
    font-size:11px;
    cursor:pointer;
    margin-top:9px;
    transition:.25s;
}
.t-prem .secondary:hover{
    background:rgba(255,255,255,.07);
    transform:translateY(-2px);
}
.t-prem .stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:13px;
    margin-top:18px;
}
.t-prem .stat{
    padding:19px;
    border-radius:17px;
    background:rgba(15,13,24,.68);
    border:1px solid var(--line);
    transition:.25s;
    position:relative;
    overflow:hidden;
}
.t-prem .stat::after{
    content:"";
    position:absolute;
    width:80px;
    height:80px;
    border-radius:50%;
    right:-45px;
    bottom:-45px;
    background:#8b5cf6;
    opacity:.08;
    filter:blur(8px);
}
.t-prem .stat:hover{
    transform:translateY(-4px);
    border-color:rgba(139,92,246,.25);
    background:rgba(26,21,41,.8);
}
.t-prem .stat-label{
    color:#777080;
    font-size:9px;
    font-weight:700;
    letter-spacing:.8px;
    margin-bottom:8px;
}
.t-prem .stat-value{
    font-size:19px;
    font-weight:900;
}
.t-prem .content{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-top:18px;
}
.t-prem .section{
    padding:25px;
}
.t-prem .section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
}
.t-prem .section-head h2{
    font-size:15px;
    font-weight:800;
}
.t-prem .section-head span{
    font-size:9px;
    color:#686174;
    font-weight:700;
    letter-spacing:1px;
}
.t-prem .menu{
    display:flex;
    flex-direction:column;
    gap:9px;
}
.t-prem .menu-item{
    display:flex;
    align-items:center;
    gap:13px;
    padding:14px;
    border:1px solid rgba(255,255,255,.055);
    background:rgba(255,255,255,.025);
    border-radius:14px;
    cursor:pointer;
    transition:.25s;
}
.t-prem .menu-item:hover{
    transform:translateX(5px);
    background:rgba(139,92,246,.07);
    border-color:rgba(139,92,246,.20);
}
.t-prem .menu-icon{
    width:43px;
    height:43px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:linear-gradient(
        145deg,
        rgba(139,92,246,.16),
        rgba(34,211,238,.07)
    );
    color:#b69aff;
}
.t-prem .menu-icon svg{
    width:20px;
    height:20px;
    fill:none;
    stroke:currentColor;
    stroke-width:1.8;
}
.t-prem .menu-text{
    flex:1;
}
.t-prem .menu-text strong{
    display:block;
    font-size:12px;
    margin-bottom:4px;
}
.t-prem .menu-text small{
    color:#777080;
    font-size:10px;
}
.t-prem .arrow{
    color:#5f596b;
    font-size:20px;
}
.t-prem .info{
    display:grid;
    gap:9px;
}
.t-prem .info-row{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:13px 14px;
    border-radius:12px;
    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.05);
}
.t-prem .info-row span:first-child{
    color:#716b7c;
    font-size:10px;
}
.t-prem .info-row span:last-child{
    color:#d7d2df;
    font-size:10px;
    font-weight:700;
}
.t-prem .notice{
    margin-top:13px;
    padding:15px;
    border-radius:13px;
    border:1px solid rgba(139,92,246,.14);
    background:rgba(139,92,246,.055);
    color:#958ca3;
    line-height:1.7;
    font-size:10px;
}
.t-prem footer{
    max-width:1180px;
    margin:auto;
    padding:24px 20px 35px;
    border-top:1px solid rgba(255,255,255,.06);
    color:#595361;
    font-size:10px;
    display:flex;
    justify-content:space-between;
}
.t-prem .modal{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.74);
    backdrop-filter:blur(14px);
}
.t-prem .modal.show{
    display:flex;
    animation:kp_fade .25s ease;
}
@keyframes kp_fade{
    from{opacity:0}
    to{opacity:1}
}
.t-prem .modal-box{
    width:100%;
    max-width:410px;
    padding:27px;
    border-radius:22px;
    background:#100d19;
    border:1px solid var(--line);
    box-shadow:0 30px 100px rgba(0,0,0,.6);
    animation:kp_modalIn .3s ease;
}
@keyframes kp_modalIn{
    from{
        opacity:0;
        transform:translateY(15px) scale(.96);
    }
    to{
        opacity:1;
        transform:none;
    }
}
.t-prem .modal-box h3{
    font-size:19px;
    margin-bottom:8px;
}
.t-prem .modal-box p{
    color:#898193;
    font-size:11px;
    line-height:1.7;
}
.t-prem .close{
    width:100%;
    border:1px solid var(--line);
    background:#1a1625;
    color:white;

const THEME_RENDER = {
  vip:    { fn: renderVip,    bg: '#050505' },
  prem:   { fn: renderPrem,   bg: '#07060d' },
  zamrud: { fn: renderZamrud, bg: '#07100d' },
  basic:  { fn: renderBasic,  bg: '#ffffff' }
};

function applyThemeShell(bg){
  document.body.style.background = bg;
  const hdr = document.querySelector('header'); if(hdr) hdr.style.display = 'none';
  mainArea.style.maxWidth = 'none'; mainArea.style.padding = '0'; mainArea.style.margin = '0';
}

async function load(){
  if(!gid){ mainArea.innerHTML = '<p>Grup tidak ditemukan.</p>'; return; }
  const snap = await getDoc(doc(db,'groups',gid));
  if(!snap.exists()){ mainArea.innerHTML = '<p>Grup tidak ditemukan atau belum disetujui.</p>'; return; }
  const g = snap.data();
  const premSnap = await getDoc(doc(db,'premiumUsers', g.ownerEmail||'-'));
  const premData = premSnap.exists() ? premSnap.data() : null;
  const isActivePremium = premData && (!premData.expiresAt || premData.expiresAt > Date.now());
  const tier = isActivePremium ? (premData.tier || 'premium') : 'none';
  const zamrudSnap = await getDoc(doc(db,'zamrudAccess', g.ownerEmail||'-'));
  const zd = zamrudSnap.exists() ? zamrudSnap.data() : null;
  const hasZamrud = zd && (!zd.expiresAt || zd.expiresAt > Date.now());

  const rSnap = await getDocs(collection(db,'groups',gid,'ratings'));
  const values = rSnap.docs.map(r=>r.data().value);
  const avg = values.length ? values.reduce((a,b)=>a+b,0)/values.length : 0;
  let starsHtml = '<div class="stars">';
  for(let n=1;n<=5;n++) starsHtml += `<span class="star ${n<=Math.round(avg)?'on':''}" onclick="window.rate(${n})">★</span>`;
  starsHtml += '</div>';
  const starsObj = { avg: avg.toFixed(1), count: values.length, html: starsHtml };

  let theme = g.theme || 'standard';
  if(theme==='vip' && tier!=='vip_plus') theme = 'standard';
  if((theme==='basic'||theme==='prem') && tier==='none') theme = 'standard';
  if(theme==='zamrud' && !hasZamrud) theme = 'standard';

  if(THEME_RENDER[theme]){
    applyThemeShell(THEME_RENDER[theme].bg);
    mainArea.innerHTML = THEME_RENDER[theme].fn(g, starsObj);
  } else {
    const titleColor = isActivePremium && g.nameColor ? `style="color:${g.nameColor}"` : '';
    mainArea.innerHTML = `
      ${g.imageUrl ? `<img class="hero-img" src="${g.imageUrl}">` : ''}
      <div class="tag-row"><span class="tag">${g.platform} · ${g.category}</span><span class="tag theme">${g.tema||''}</span></div>
      <h1 ${titleColor}>${g.title} ${g.verified?`<span class="badge-verified">${ic.check}</span>`:''}</h1>
      <p class="desc">${g.desc||''}</p>
      ${starsHtml}<br><span style="color:var(--dim); font-size:.8rem;">${starsObj.avg} dari ${starsObj.count} vote</span>
      <a class="btn btn-join" target="_blank" href="${g.link}">${ic.join} Gabung Grup</a>
      <a class="btn btn-wa" target="_blank" href="${g.link}">${ic.chat} Buka di ${g.platform||'Chat'}</a>
    `;
  }
  if(window.__animatePage) window.__animatePage();

  window.rate = async (n) => {
    if(!currentUser){ if(confirm('Login dulu buat kasih rating. Login sekarang?')) window.doLogin(); return; }
    await setDoc(doc(db,'groups',gid,'ratings',currentUser.uid), { value:n });
    load();
  };
}
load();
</script>
<script>
(function(){
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var first = true;
  function countUp(el){
    var t = el.textContent.trim();
    if(!/^\d+(\.\d+)?$/.test(t)) return;
    var end = parseFloat(t), dec = (t.split('.')[1]||'').length, t0 = performance.now(), dur = 800;
    (function tick(now){
      var k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3);
      el.textContent = (end*e).toFixed(dec);
      if(k<1) requestAnimationFrame(tick); else el.textContent = t;
    })(t0);
  }
  window.__animatePage = function(){
    if(reduce) return;
    var root = document.getElementById('mainArea');
    if(!first){
      root.querySelectorAll('.star.on').forEach(function(st,i){
        st.animate([{scale:'1'},{scale:'1.5'},{scale:'1'}],{duration:320,delay:i*45,easing:'ease-out'});
      });
      return;
    }
    first = false;
    root.animate([{opacity:0},{opacity:1}],{duration:260,easing:'ease-out'});
    var sel = ['nav','.navbar','.profile','.hero > *','.stat','.join','.join-card','section.glass','.glass.section','.section','.info-row','a.card','.card','.hero-img','.tag-row','h1','.desc','.btn'];
    var seen = new Set(), list = [];
    sel.forEach(function(q){ root.querySelectorAll(q).forEach(function(el){ if(!seen.has(el)){ seen.add(el); list.push(el); } }); });
    list.slice(0,26).forEach(function(el,i){
      el.animate([{opacity:0,transform:'translateY(18px) scale(.98)'},{opacity:1,transform:'none'}],
        {duration:520,delay:60+i*55,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'});
    });
    root.querySelectorAll('.stat-value').forEach(countUp);
  };
  // ripple klik
  document.addEventListener('pointerdown', function(e){
    if(reduce) return;
    var t = e.target.closest('.primary,.secondary,.join-btn,.secondary-btn,.btn,.nav-btn,.nav-button,.home-ico,.item,a.card');
    if(!t) return;
    if(getComputedStyle(t).position==='static') t.style.position='relative';
    var r = t.getBoundingClientRect(), size = Math.max(r.width,r.height)*2;
    var w = document.createElement('span'); w.className='fx-wrap';
    var d = document.createElement('span'); d.className='fx-ripple';
    d.style.cssText='width:'+size+'px;height:'+size+'px;left:'+(e.clientX-r.left-size/2)+'px;top:'+(e.clientY-r.top-size/2)+'px';
    w.appendChild(d); t.appendChild(w); setTimeout(function(){ w.remove(); },650);
    if(navigator.vibrate){ try{ navigator.vibrate(8); }catch(_){} }
  }, {passive:true});
  window.addEventListener('pageshow', function(){ document.body.classList.remove('page-leave'); });
  // transisi keluar saat ke beranda
  document.addEventListener('click', function(e){
    var a = e.target.closest('a[href="index.html"]');
    if(!a || reduce || e.metaKey || e.ctrlKey) return;
    e.preventDefault(); document.body.classList.add('page-leave');
    setTimeout(function(){ location.href = a.getAttribute('href'); }, 170);
  });
})();
</script>
