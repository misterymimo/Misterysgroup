<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Grup — Mistygrou</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0D0C0A; --surface:#17140F; --line:#2B2620; --text:#F1ECE1; --dim:#9C9488; --brass:#C9A24B; --forest:#3FAE7A; }
  *{box-sizing:border-box;} body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;}
  a{color:inherit;}
  header{padding:18px 22px; border-bottom:1px solid var(--line);}
  .logo{font-family:'Fraunces',serif; font-weight:700; font-size:1.2rem; text-decoration:none;}
  .logo span{color:var(--brass);}
  main{max-width:560px; margin:0 auto; padding:22px;}
  .hero-img{width:100%; aspect-ratio:1.8; object-fit:cover; border-radius:14px; background:#000; margin-bottom:16px;}
  .tag-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:4px;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:.68rem; color:var(--forest); background:rgba(63,174,122,.1); padding:3px 8px; border-radius:6px;}
  .tag.theme{color:var(--brass); background:rgba(201,162,75,.12);}
  h1{font-family:'Fraunces',serif; font-size:1.5rem; margin:8px 0; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .badge-verified{display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border-radius:99px; background:#3B7DD8;}
  p.desc{color:var(--dim); font-size:.92rem; line-height:1.6;}
  .stars{display:inline-flex; gap:3px; margin:10px 0;}
  .stars .star{color:var(--line); font-size:1.4rem; cursor:pointer;}
  .stars .star.on{color:var(--brass);}
  .btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; text-align:center; padding:13px; border-radius:10px; font-weight:600; margin-top:10px; text-decoration:none; font-family:'Inter',sans-serif;}
  .btn-join{background:var(--forest); color:#04170D;}
  .btn-wa{background:#25D366; color:#062B14;}
  .spinner{font-family:'JetBrains Mono',monospace; color:var(--forest); text-align:center; padding:40px;}

  /* ===== Mesin tema kaca (glass) untuk basic/prem/vip/zamrud ===== */
  .glass-page{ min-height:100vh; padding:40px 20px 60px; }
  .glass-card{ max-width:420px; margin:0 auto; border-radius:22px; padding:30px 24px; text-align:center; backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
  .glass-avatar{ width:104px; height:104px; border-radius:50%; object-fit:cover; margin:0 auto 14px; display:block; }
  .glass-name{ font-family:'Fraunces',serif; font-weight:700; font-size:1.4rem; margin:0 0 4px; display:flex; align-items:center; justify-content:center; gap:7px; flex-wrap:wrap; }
  .glass-tag{ font-family:'JetBrains Mono',monospace; font-size:.68rem; opacity:.85; margin-bottom:14px; }
  .glass-desc{ font-size:.86rem; line-height:1.6; opacity:.82; margin-bottom:18px; }
  .glass-stats{ display:flex; justify-content:center; gap:22px; margin-bottom:20px; padding:14px 0; border-top:1px solid; border-bottom:1px solid; }
  .glass-stat b{ display:block; font-family:'JetBrains Mono',monospace; font-size:1.05rem; }
  .glass-stat span{ font-size:.65rem; opacity:.7; text-transform:uppercase; letter-spacing:.04em; }
  .glass-menu{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .glass-item{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-radius:14px; text-decoration:none; font-weight:600; font-size:.88rem; border:1px solid; transition:transform .15s; }
  .glass-item:active{ transform:scale(.97); }
  .glass-icbox{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .glass-back{ display:block; text-align:center; margin-top:18px; font-size:.78rem; opacity:.6; text-decoration:underline; }
</style>
</head>
<body>

<header><a href="index.html" class="logo">Misty<span>grou</span></a></header>

<main id="mainArea"><div class="spinner">Memuat...</div></main>

<script type="module">
import { initializeApp } from "https://cdn.jsdelivr.net/npm/firebase@10.12.0/app/+esm";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://cdn.jsdelivr.net/npm/firebase@10.12.0/auth/+esm";
import { getFirestore, doc, getDoc, collection, getDocs, setDoc } from "https://cdn.jsdelivr.net/npm/firebase@10.12.0/firestore/+esm";

const firebaseConfig = {
  apiKey: "AIzaSyDabShBKh-VO0nFtyjeiQuMUZ7-YScrajc",
  authDomain: "itemdrop-marketplace.firebaseapp.com",
  projectId: "itemdrop-marketplace",
  storageBucket: "itemdrop-marketplace.firebasestorage.app",
  messagingSenderId: "1019572855068",
  appId: "1:1019572855068:web:ef886624def992fbcd1ad9"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;
const gid = new URLSearchParams(location.search).get('id');
const mainArea = document.getElementById('mainArea');

const ic = {
  check: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  join: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>`,
  chat: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 0 1-3.8 7.1 8.5 8.5 0 0 1-8.9.5L3 21l1.9-5.7a8.5 8.5 0 0 1 12-11 8.4 8.4 0 0 1 4.1 7.2z"/></svg>`,
  whatsapp: `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1l-.8.9c-.1.2-.3.2-.5.1-.7-.3-1.5-.8-2.1-1.5-.5-.6-.9-1.2-1-1.4-.1-.2 0-.4.1-.5l.4-.5c.1-.1.1-.3.1-.4 0-.1-.5-1.3-.7-1.7-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 2s.8 2.3.9 2.5c.1.2 1.7 2.6 4.1 3.6.6.2 1 .4 1.4.5.6.2 1.1.1 1.5.1.5-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z"/></svg>`,
  megaphone: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a2 2 0 0 0 2 2h1l4 5v-16l-4 5H5a2 2 0 0 0-2 2z"/><path d="M17 8a5 5 0 0 1 0 8"/><path d="M20 5a9 9 0 0 1 0 14"/></svg>`,
  phone: `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.3 1.8.6 2.7a2 2 0 0 1-.4 2.1L8.1 9.7a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.5 2.7.6a2 2 0 0 1 1.9 2.2z"/></svg>`
};

// Palet diambil persis dari file referensi basic/Prem/VIP/zamrud
const PALETTES = {
  basic:  { bg:'#F3F5F7', bgImg:'radial-gradient(circle at 30% 0%, rgba(37,211,102,.08), transparent 40%)', card:'rgba(255,255,255,.75)', line:'rgba(0,0,0,.08)', text:'#10231c', muted:'#5b6b65', a1:'#25D366', a2:'#128C7E', label:'Basic' },
  prem:   { bg:'#07060d', bgImg:'radial-gradient(circle at 15% 0%, rgba(139,92,246,.25), transparent 40%), radial-gradient(circle at 90% 20%, rgba(34,211,238,.18), transparent 35%), radial-gradient(circle at 50% 100%, rgba(236,72,153,.15), transparent 40%)', card:'rgba(20,17,32,.68)', line:'rgba(255,255,255,.09)', text:'#f8f7ff', muted:'#9993ab', a1:'#8b5cf6', a2:'#22d3ee', label:'Premium' },
  vip:    { bg:'#050505', bgImg:'radial-gradient(circle at 20% 10%, rgba(255,255,255,.10), transparent 25%), radial-gradient(circle at 85% 25%, rgba(255,255,255,.07), transparent 25%)', card:'rgba(255,255,255,.075)', line:'rgba(255,255,255,.14)', text:'#ffffff', muted:'rgba(255,255,255,.6)', a1:'#ffffff', a2:'#cfcfcf', label:'VIP' },
  zamrud: { bg:'#07100d', bgImg:'radial-gradient(circle at 50% -10%, rgba(37,211,102,.18), transparent 35%), radial-gradient(circle at 0% 50%, rgba(18,140,126,.12), transparent 30%)', card:'#0d1915', line:'rgba(255,255,255,.08)', text:'#f5fff9', muted:'#8ea198', a1:'#25d366', a2:'#128c7e', label:'Zamrud' },
};

onAuthStateChanged(auth, user => { currentUser = user; });
window.doLogin = () => signInWithPopup(auth, new GoogleAuthProvider());

function renderGlass(g, pal, stars){
  document.body.style.background = pal.bg;
  mainArea.style.maxWidth = 'none';
  mainArea.style.padding = '0';
  mainArea.style.margin = '0';
  const avatarHtml = g.imageUrl ? `<img class="glass-avatar" src="${g.imageUrl}" style="border:2px solid ${pal.a1};">` : `<div class="glass-avatar" style="background:${pal.card}; border:2px solid ${pal.a1};"></div>`;
  return `
    <div class="glass-page" style="background-color:${pal.bg}; background-image:${pal.bgImg};">
      <div class="glass-card" style="background:${pal.card}; border:1px solid ${pal.line}; color:${pal.text}; box-shadow:0 20px 60px -20px ${pal.a1}55;">
        ${avatarHtml}
        <h1 class="glass-name" style="color:${pal.text};">${g.title} ${g.verified?`<span class="badge-verified">${ic.check}</span>`:''}</h1>
        <div class="glass-tag" style="color:${pal.a1};">${pal.label.toUpperCase()} · ${g.platform} · ${g.category}${g.tema?' · '+g.tema:''}</div>
        <p class="glass-desc" style="color:${pal.muted};">${g.desc||''}</p>
        <div class="glass-stats" style="border-color:${pal.line};">
          <div class="glass-stat"><b style="color:${pal.a1};">${stars.avg}</b><span style="color:${pal.muted};">Rating</span></div>
          <div class="glass-stat"><b style="color:${pal.a2};">${stars.count}</b><span style="color:${pal.muted};">Vote</span></div>
        </div>
        <div class="glass-menu">
          <a class="glass-item" target="_blank" href="${g.link}" style="background:${pal.a1}22; border-color:${pal.a1}55; color:${pal.text};">
            <span class="glass-icbox" style="background:${pal.a1}33; color:${pal.a1};">${ic.whatsapp}</span> Join Grup WhatsApp</a>
          <a class="glass-item" target="_blank" href="${g.link}" style="background:${pal.a2}22; border-color:${pal.a2}55; color:${pal.text};">
            <span class="glass-icbox" style="background:${pal.a2}33; color:${pal.a2};">${ic.megaphone}</span> Join Saluran WhatsApp</a>
          ${g.adminContact ? `<a class="glass-item" target="_blank" href="https://wa.me/${g.adminContact}?text=${encodeURIComponent('Halo, saya mau tanya soal grup: '+g.title)}" style="background:${pal.line}; border-color:${pal.line}; color:${pal.text};">
            <span class="glass-icbox" style="background:${pal.a1}22; color:${pal.a1};">${ic.phone}</span> Kontak Admin Grup</a>` : ''}
        </div>
        <div style="color:${pal.a1};">${stars.html}</div>
        <a href="index.html" class="glass-back" style="color:${pal.muted};">&larr; Kembali ke Mistygrou</a>
      </div>
    </div>`;
}

async function load(){
  if(!gid){ mainArea.innerHTML = '<p>Grup tidak ditemukan.</p>'; return; }
  const snap = await getDoc(doc(db,'groups',gid));
  if(!snap.exists()){ mainArea.innerHTML = '<p>Grup tidak ditemukan atau belum disetujui.</p>'; return; }
  const g = snap.data();
  const premSnap = await getDoc(doc(db,'premiumUsers', g.ownerEmail||'-'));
  const premData = premSnap.exists() ? premSnap.data() : null;
  const isActivePremium = premData && (!premData.expiresAt || premData.expiresAt > Date.now());
  const tier = isActivePremium ? (premData.tier || 'premium') : 'none';
  const zamrudSnap = await getDoc(doc(db,'zamrudAccess', g.ownerEmail||'-'));
  const zd = zamrudSnap.exists() ? zamrudSnap.data() : null;
  const hasZamrud = zd && (!zd.expiresAt || zd.expiresAt > Date.now());

  const rSnap = await getDocs(collection(db,'groups',gid,'ratings'));
  const values = rSnap.docs.map(r=>r.data().value);
  const avg = values.length ? values.reduce((a,b)=>a+b,0)/values.length : 0;
  let starsHtml = '<div class="stars">';
  for(let n=1;n<=5;n++) starsHtml += `<span class="star ${n<=Math.round(avg)?'on':''}" onclick="window.rate(${n})">★</span>`;
  starsHtml += '</div>';
  const starsObj = { avg: avg.toFixed(1), count: values.length, html: starsHtml };

  let theme = g.theme || 'standard';
  if(theme==='vip' && tier!=='vip_plus') theme = 'standard';
  if((theme==='basic'||theme==='prem') && tier==='none') theme = 'standard';
  if(theme==='zamrud' && !hasZamrud) theme = 'standard';

  if(theme !== 'standard'){
    mainArea.innerHTML = renderGlass(g, PALETTES[theme], starsObj);
  } else {
    const titleColor = isActivePremium && g.nameColor ? `style="color:${g.nameColor}"` : '';
    mainArea.innerHTML = `
      ${g.imageUrl ? `<img class="hero-img" src="${g.imageUrl}">` : ''}
      <div class="tag-row"><span class="tag">${g.platform} · ${g.category}</span><span class="tag theme">${g.tema||''}</span></div>
      <h1 ${titleColor}>${g.title} ${g.verified?`<span class="badge-verified">${ic.check}</span>`:''}</h1>
      <p class="desc">${g.desc||''}</p>
      ${starsHtml}<br><span style="color:var(--dim); font-size:.8rem;">${starsObj.avg} dari ${starsObj.count} vote</span>
      <a class="btn btn-join" target="_blank" href="${g.link}">${ic.join} Gabung Grup</a>
      <a class="btn btn-wa" target="_blank" href="${g.link}">${ic.chat} Buka di ${g.platform||'Chat'}</a>
    `;
  }

  window.rate = async (n) => {
    if(!currentUser){ if(confirm('Login dulu buat kasih rating. Login sekarang?')) window.doLogin(); return; }
    await setDoc(doc(db,'groups',gid,'ratings',currentUser.uid), { value:n });
    load();
  };
}
load();
</script>
</body>
</html>
