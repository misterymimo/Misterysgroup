<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mistygrou Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0D0C0A; --surface:#17140F; --line:#2B2620; --text:#F1ECE1; --dim:#9C9488; --brass:#C9A24B; --forest:#3FAE7A; --danger:#D9695A; }
  *{box-sizing:border-box;} body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;}
  header{display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--line);}
  .logo{font-family:'Fraunces',serif; font-weight:700; font-size:1.25rem;}
  .logo span{color:var(--brass);}
  button{font-family:'Inter',sans-serif; cursor:pointer; border:none; border-radius:8px;}
  .btn-primary{background:var(--forest); color:#04170D; font-weight:600; padding:9px 14px; font-size:.82rem;}
  .btn-danger{background:var(--danger); color:#2A0D08; font-weight:600; padding:9px 14px; font-size:.82rem;}
  .btn-gold{background:var(--brass); color:#241a05; font-weight:600; padding:9px 14px; font-size:.82rem;}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--line); padding:9px 14px; font-size:.82rem;}
  main{max-width:800px; margin:0 auto; padding:22px;}
  .nav-tabs{display:flex; gap:6px; margin-bottom:16px;}
  .nav-tab{font-size:.82rem; color:var(--dim); background:transparent; border:1px solid var(--line); padding:8px 16px; border-radius:99px;}
  .nav-tab.active{background:var(--surface); color:var(--text); border-color:var(--brass);}
  .section-title{font-family:'JetBrains Mono',monospace; font-size:.72rem; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin:22px 0 10px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px;}
  .card img{width:100%; max-width:220px; aspect-ratio:1.6; object-fit:cover; border-radius:8px; margin-bottom:8px; background:#000;}
  .tag{font-family:'JetBrains Mono',monospace; font-size:.63rem; color:var(--forest);}
  .owner-email{font-family:'JetBrains Mono',monospace; font-size:.72rem; color:var(--brass); display:block; margin:6px 0;}
  .card h3{font-family:'Fraunces',serif; font-size:1rem; margin:6px 0 4px; display:flex; align-items:center; gap:6px;}
  .card p{color:var(--dim); font-size:.82rem; margin:0 0 8px;}
  .status-badge{font-family:'JetBrains Mono',monospace; font-size:.65rem; padding:3px 8px; border-radius:99px; display:inline-block; margin-bottom:6px;}
  .status-pending{background:#2A2515; color:var(--brass);}
  .status-approved{background:#12251C; color:var(--forest);}
  .actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;}
  .center-box{max-width:420px; margin:80px auto; text-align:center; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:30px 22px;}
  .spinner{font-family:'JetBrains Mono',monospace; font-size:.8rem; color:var(--forest); text-align:center; padding:20px;}
  .prem-input-row{display:flex; gap:8px; margin-bottom:16px;}
  .prem-input-row input{flex:1; padding:10px 14px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;}
  .prem-item{display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:8px;}
  .prem-item span{font-family:'JetBrains Mono',monospace; font-size:.82rem;}
</style>
</head>
<body>

<header>
  <div class="logo">Misty<span>grou</span> · Admin</div>
  <div id="authArea"></div>
</header>

<main>
  <div class="nav-tabs" id="navTabs" style="display:none; overflow-x:auto; flex-wrap:nowrap;">
    <button class="nav-tab active" id="tabReview" onclick="switchTab('review')" style="flex-shrink:0;">Tinjauan</button>
    <button class="nav-tab" id="tabPremium" onclick="switchTab('premium')" style="flex-shrink:0;">Premium</button>
    <button class="nav-tab" id="tabMisi" onclick="switchTab('misi')" style="flex-shrink:0;">Misi</button>
    <button class="nav-tab" id="tabPesan" onclick="switchTab('pesan')" style="flex-shrink:0;">Pesan</button>
  </div>
  <div id="reviewArea"><div class="spinner">Memuat...</div></div>
  <div id="premiumArea" style="display:none;"></div>
  <div id="misiArea" style="display:none;"></div>
  <div id="pesanArea" style="display:none;"></div>
</main>

<script type="module">
import { initializeApp } from "https://cdn.jsdelivr.net/npm/firebase@10.12.0/app/+esm";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://cdn.jsdelivr.net/npm/firebase@10.12.0/auth/+esm";
import { getFirestore, collection, onSnapshot, doc, getDoc, updateDoc, deleteDoc, setDoc, addDoc } from "https://cdn.jsdelivr.net/npm/firebase@10.12.0/firestore/+esm";

const firebaseConfig = {
  apiKey: "AIzaSyDabShBKh-VO0nFtyjeiQuMUZ7-YScrajc",
  authDomain: "itemdrop-marketplace.firebaseapp.com",
  projectId: "itemdrop-marketplace",
  storageBucket: "itemdrop-marketplace.firebasestorage.app",
  messagingSenderId: "1019572855068",
  appId: "1:1019572855068:web:ef886624def992fbcd1ad9"
};
const ADMIN_UID = "GdZcEd4dZNPE1qpHnSxaofCYjYL2";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let unsub = null, premUnsub = null;

const authArea = document.getElementById('authArea');
const reviewArea = document.getElementById('reviewArea');
const premiumArea = document.getElementById('premiumArea');

onAuthStateChanged(auth, user => {
  if(!user){
    authArea.innerHTML = `<button class="btn-primary" onclick="window.doLogin()">Login dengan Google</button>`;
    reviewArea.innerHTML = `<div class="center-box"><p>Login pakai akun admin buat masuk panel ini.</p></div>`;
    document.getElementById('navTabs').style.display = 'none';
    if(unsub){ unsub(); unsub=null; }
    return;
  }
  authArea.innerHTML = `<span style="font-size:.8rem; color:var(--dim); margin-right:10px;">${user.displayName}</span><button class="btn-ghost" onclick="window.doLogout()">Keluar</button>`;
  if(user.uid !== ADMIN_UID){
    reviewArea.innerHTML = `<div class="center-box"><h3 style="font-family:'Fraunces',serif;">Akses Ditolak</h3><p style="color:var(--dim); font-size:.85rem;">Akun ini bukan akun admin Mistygrou.</p></div>`;
    return;
  }
  document.getElementById('navTabs').style.display = 'flex';
  listenGroups();
  listenPremium();
});

window.doLogin = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e=>alert('Login gagal: '+e.message));
window.doLogout = () => signOut(auth);

window.switchTab = (tab) => {
  reviewArea.style.display = tab==='review' ? 'block' : 'none';
  premiumArea.style.display = tab==='premium' ? 'block' : 'none';
  document.getElementById('misiArea').style.display = tab==='misi' ? 'block' : 'none';
  document.getElementById('pesanArea').style.display = tab==='pesan' ? 'block' : 'none';
  document.getElementById('tabReview').classList.toggle('active', tab==='review');
  document.getElementById('tabPremium').classList.toggle('active', tab==='premium');
  document.getElementById('tabMisi').classList.toggle('active', tab==='misi');
  document.getElementById('tabPesan').classList.toggle('active', tab==='pesan');
  if(tab==='misi') listenMisi();
  if(tab==='pesan') listenPesan();
};

function listenGroups(){
  if(unsub) unsub();
  unsub = onSnapshot(collection(db,'groups'), snap => {
    const groups = snap.docs.map(d=>({id:d.id, ...d.data()}));
    groups.sort((a,b)=> (a.reviewed?1:0) - (b.reviewed?1:0));
    const pending = groups.filter(g=>!g.reviewed);
    const approved = groups.filter(g=>g.reviewed);
    reviewArea.innerHTML = `
      <div class="section-title">Menunggu Tinjauan (${pending.length})</div>
      ${pending.map(cardHtml).join('') || '<p style="color:var(--dim);">Tidak ada yang menunggu.</p>'}
      <div class="section-title">Sudah Disetujui (${approved.length})</div>
      ${approved.map(cardHtml).join('') || '<p style="color:var(--dim);">Belum ada yang disetujui.</p>'}
    `;
  }, err => { reviewArea.innerHTML = `<p style="color:var(--dim);">Gagal memuat: ${err.message}</p>`; });
}

function cardHtml(g){
  return `<div class="card">
    ${g.imageUrl ? `<img src="${g.imageUrl}">` : ''}
    <span class="status-badge ${g.reviewed?'status-approved':'status-pending'}">${g.reviewed?'Disetujui':'Menunggu'}</span>
    <span class="tag">${g.platform||''} · ${g.category||''} · ${g.tema||''}</span>
    <h3>${g.title||'(tanpa judul)'} ${g.verified?'✓':''}</h3>
    <span class="owner-email">Pemilik: ${g.ownerEmail||'-'}</span>
    <p>${g.desc||''}</p>
    <a href="${g.link}" target="_blank" style="color:var(--forest); font-size:.78rem;">${g.link||''}</a>
    <div class="actions">
      ${!g.reviewed ? `<button class="btn-primary" onclick="window.approveGroup('${g.id}')">Approve</button>` : ''}
      <button class="btn-gold" onclick="window.toggleVerified('${g.id}', ${!g.verified})">${g.verified?'Hapus Centang Biru':'Kasih Centang Biru'}</button>
      <button class="btn-ghost" onclick="window.quickMessage('${g.ownerEmail||''}')">Kirim Pesan</button>
      <button class="btn-danger" onclick="window.rejectGroup('${g.id}', '${g.ownerEmail||''}')">Tolak & Hapus</button>
    </div>
  </div>`;
}

window.approveGroup = async (id) => { await updateDoc(doc(db,'groups',id), { reviewed:true }); };
window.toggleVerified = async (id, val) => { await updateDoc(doc(db,'groups',id), { verified:val }); };
window.rejectGroup = async (id, ownerEmail) => {
  if(!confirm('Yakin mau hapus grup ini permanen?')) return;
  if(ownerEmail && confirm('Mau kirim pesan ke pemilik grup ini soal alasan penolakan?')){
    const msg = prompt('Tulis pesannya:');
    if(msg && msg.trim()){
      await addDoc(collection(db,'messages'), { toEmail: ownerEmail, text: msg.trim(), createdAt: Date.now(), read:false });
    }
  }
  await deleteDoc(doc(db,'groups',id));
};
window.quickMessage = async (ownerEmail) => {
  if(!ownerEmail){ alert('Email pemilik tidak ditemukan.'); return; }
  const msg = prompt('Tulis pesan buat '+ownerEmail+':');
  if(msg && msg.trim()){
    await addDoc(collection(db,'messages'), { toEmail: ownerEmail, text: msg.trim(), createdAt: Date.now(), read:false });
    alert('Pesan terkirim.');
  }
};

function listenPremium(){
  if(premUnsub) premUnsub();
  let claimsCache = [], transfersCache = [];
  onSnapshot(collection(db,'premiumClaims'), snap => {
    claimsCache = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderPremiumArea(claimsCache, transfersCache);
  });
  onSnapshot(collection(db,'premiumTransfers'), snap => {
    transfersCache = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderPremiumArea(claimsCache, transfersCache);
  });
  premUnsub = onSnapshot(collection(db,'premiumUsers'), snap => {
    window._premiumEmailsCache = snap.docs.map(d=>({email:d.id, ...d.data()}));
    renderPremiumArea(claimsCache, transfersCache);
  });
}

function sourceLabel(u){
  if(u.source==='gacha') return '(dari Roda Hadiah)';
  if(u.source==='misi') return '(dari Misi: '+(u.missionTitle||'-')+')';
  if(u.source==='transfer') return '(transfer dari '+(u.fromEmail||'?')+')';
  return '(manual/beli)';
}
function remainLabel(u){
  if(!u.expiresAt) return 'Permanen';
  const ms = u.expiresAt - Date.now();
  if(ms <= 0) return 'Kadaluarsa';
  return Math.floor(ms/86400000)+' hari '+Math.floor((ms%86400000)/3600000)+' jam lagi';
}

let gachaDaysConfig = 30;
onSnapshot(doc(db,'settings','premiumConfig'), snap => { if(snap.exists()) gachaDaysConfig = snap.data().gachaDays || 30; });

function renderPremiumArea(claims, transfers){
  const users = window._premiumEmailsCache || [];
  premiumArea.innerHTML = `
    <div class="card">
      <label style="display:block; font-size:.78rem; color:var(--dim); margin-bottom:4px;">Durasi Premium dari Roda Hadiah (hari)</label>
      <div style="display:flex; gap:8px;">
        <input id="gachaDaysInput" type="number" value="${gachaDaysConfig}" style="flex:1; padding:9px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--text);">
        <button class="btn-gold" onclick="window.saveGachaDays()">Simpan</button>
      </div>
    </div>

    <div class="section-title">Klaim Jackpot & Misi (${claims.length})</div>
    ${claims.map(c=>`<div class="prem-item"><span>${c.displayName||''} — ${c.email}<br><span style="color:var(--dim); font-weight:400;">${c.source==='misi'?'Misi: '+c.missionTitle:'Roda Hadiah'} · ${c.premiumDays} hari</span></span>
      <span><button class="btn-primary" onclick="window.approveClaim('${c.id}','${c.email}',${c.premiumDays},'${c.source}','${(c.missionTitle||'').replace(/'/g,"")}')">Approve</button>
      <button class="btn-danger" onclick="window.rejectClaim('${c.id}')">Tolak</button></span></div>`).join('') || '<p style="color:var(--dim);">Tidak ada klaim menunggu.</p>'}

    <div class="section-title">Permintaan Transfer Premium (${transfers.length})</div>
    ${transfers.map(t=>`<div class="prem-item"><span>${t.fromEmail} → ${t.toEmail}</span>
      <span><button class="btn-primary" onclick="window.approveTransfer('${t.id}','${t.fromEmail}','${t.toEmail}')">Approve</button>
      <button class="btn-danger" onclick="window.rejectTransfer('${t.id}')">Tolak</button></span></div>`).join('') || '<p style="color:var(--dim);">Tidak ada permintaan transfer.</p>'}

    <div class="card" style="margin-top:22px;">
      <label style="display:block; font-size:.78rem; color:var(--dim); margin-bottom:4px;">Gmail</label>
      <input id="premInput" type="email" placeholder="aaaa@gmail.com" style="width:100%; padding:9px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--text); margin-bottom:8px;" onkeydown="if(event.key==='Enter') window.addPremium()">
      <label style="display:block; font-size:.78rem; color:var(--dim); margin-bottom:4px;">Durasi (hari, kosongkan = permanen)</label>
      <input id="premDaysInput" type="number" placeholder="30" style="width:100%; padding:9px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--text); margin-bottom:10px;">
      <button class="btn-gold" onclick="window.addPremium()">Tambah Premium</button>
    </div>
    <div class="section-title">Daftar Akun Premium (${users.length})</div>
    ${users.map(u=>`<div class="prem-item"><span>${u.email} <span style="color:var(--dim); font-weight:400;">${sourceLabel(u)}<br>Sisa: ${remainLabel(u)}</span></span>
      <span style="display:flex; gap:6px; align-items:center;">
        <input id="edit_${u.email.replace(/[^a-zA-Z0-9]/g,'_')}" type="number" placeholder="hari baru" style="width:80px; padding:6px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text);">
        <button class="btn-gold" onclick="window.updateExpiry('${u.email}')">Set</button>
        <button class="btn-danger" onclick="window.removePremium('${u.email}')">Hapus</button>
      </span></div>`).join('') || '<p style="color:var(--dim);">Belum ada akun premium.</p>'}
  `;
}

window.saveGachaDays = async () => {
  const val = parseInt(document.getElementById('gachaDaysInput').value) || 30;
  await setDoc(doc(db,'settings','premiumConfig'), { gachaDays: val });
  alert('Durasi premium Roda Hadiah disimpan: '+val+' hari');
};

window.approveClaim = async (claimId, email, premiumDays, source, missionTitle) => {
  const payload = { addedAt: Date.now(), source, expiresAt: Date.now() + premiumDays*86400000 };
  if(source==='misi') payload.missionTitle = missionTitle;
  await setDoc(doc(db,'premiumUsers', email), payload);
  await deleteDoc(doc(db,'premiumClaims', claimId));
};
window.rejectClaim = async (claimId) => {
  if(confirm('Tolak klaim ini?')) await deleteDoc(doc(db,'premiumClaims', claimId));
};
window.approveTransfer = async (transferId, fromEmail, toEmail) => {
  const fromSnap = await getDoc(doc(db,'premiumUsers', fromEmail));
  const expiresAt = fromSnap.exists() ? (fromSnap.data().expiresAt || null) : null;
  await setDoc(doc(db,'premiumUsers', toEmail), { addedAt: Date.now(), source:'transfer', fromEmail, expiresAt });
  await deleteDoc(doc(db,'premiumUsers', fromEmail));
  await deleteDoc(doc(db,'premiumTransfers', transferId));
};
window.rejectTransfer = async (transferId) => {
  if(confirm('Tolak permintaan transfer ini?')) await deleteDoc(doc(db,'premiumTransfers', transferId));
};
window.updateExpiry = async (email) => {
  const input = document.getElementById('edit_'+email.replace(/[^a-zA-Z0-9]/g,'_'));
  const days = parseInt(input.value);
  if(!days){ alert('Masukkan jumlah hari.'); return; }
  await updateDoc(doc(db,'premiumUsers', email), { expiresAt: Date.now() + days*86400000 });
  input.value = '';
};

// ===== Misi =====
let misiUnsub = null;
function listenMisi(){
  if(misiUnsub) misiUnsub();
  misiUnsub = onSnapshot(collection(db,'missions'), snap => {
    const missions = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderMisiArea(missions);
  });
}

function renderMisiArea(missions){
  const now = Date.now();
  document.getElementById('misiArea').innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">Buat Misi Baru</h3>
      <label style="display:block; font-size:.78rem; color:var(--dim); margin:8px 0 4px;">Judul Misi</label>
      <input id="misiTitle" placeholder="Contoh: Tonton 30 Iklan dalam 7 Hari" style="width:100%; padding:9px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--text); margin-bottom:8px;">
      <label style="display:block; font-size:.78rem; color:var(--dim); margin:8px 0 4px;">Target Nonton Iklan (x)</label>
      <input id="misiTarget" type="number" value="30" style="width:100%; padding:9px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--text); margin-bottom:8px;">
      <label style="display:block; font-size:.78rem; color:var(--dim); margin:8px 0 4px;">Batas Waktu (hari)</label>
      <input id="misiDeadline" type="number" value="7" style="width:100%; padding:9px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--text); margin-bottom:8px;">
      <label style="display:block; font-size:.78rem; color:var(--dim); margin:8px 0 4px;">Hadiah Premium (hari)</label>
      <input id="misiPremiumDays" type="number" value="30" style="width:100%; padding:9px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--text); margin-bottom:12px;">
      <button class="btn-primary" onclick="window.addMisi()">Buat Misi</button>
    </div>
    <div class="section-title">Misi Aktif (${missions.length})</div>
    ${missions.map(m=>{
      const remainMs = (m.createdAt + m.deadlineDays*86400000) - now;
      const expired = remainMs <= 0;
      const d = Math.max(0,Math.floor(remainMs/86400000)), h = Math.max(0,Math.floor((remainMs%86400000)/3600000));
      return `<div class="prem-item"><span>${m.title} — target ${m.targetCount}x, hadiah ${m.premiumDays} hari<br>
        <span style="color:var(--dim); font-weight:400;">${expired?'Sudah expired':'Sisa waktu: '+d+'h '+h+'j'}</span></span>
        <button class="btn-danger" onclick="window.deleteMisi('${m.id}')">Hapus</button></div>`;
    }).join('') || '<p style="color:var(--dim);">Belum ada misi.</p>'}
  `;
}

window.addMisi = async () => {
  const title = document.getElementById('misiTitle').value.trim();
  const targetCount = parseInt(document.getElementById('misiTarget').value);
  const deadlineDays = parseInt(document.getElementById('misiDeadline').value);
  const premiumDays = parseInt(document.getElementById('misiPremiumDays').value);
  if(!title || !targetCount || !deadlineDays || !premiumDays){ alert('Lengkapi semua field.'); return; }
  await addDoc(collection(db,'missions'), { title, targetCount, deadlineDays, premiumDays, createdAt: Date.now() });
};
window.deleteMisi = async (id) => {
  if(confirm('Hapus misi ini?')) await deleteDoc(doc(db,'missions', id));
};

// ===== Pesan =====
let pesanUnsub = null;
function listenPesan(){
  if(pesanUnsub) pesanUnsub();
  pesanUnsub = onSnapshot(collection(db,'messages'), snap => {
    const msgs = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>b.createdAt-a.createdAt);
    renderPesanArea(msgs);
  });
}
function renderPesanArea(msgs){
  document.getElementById('pesanArea').innerHTML = `
    <div class="card">
      <h3 style="margin-top:0;">Kirim Pesan Baru</h3>
      <label style="display:block; font-size:.78rem; color:var(--dim); margin:8px 0 4px;">Gmail Tujuan (yang dipakai login)</label>
      <input id="pesanEmail" type="email" placeholder="contoh@gmail.com" style="width:100%; padding:9px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--text); margin-bottom:8px;">
      <label style="display:block; font-size:.78rem; color:var(--dim); margin:8px 0 4px;">Isi Pesan</label>
      <textarea id="pesanText" rows="3" style="width:100%; padding:9px; border-radius:7px; border:1px solid var(--line); background:var(--bg); color:var(--text); margin-bottom:10px;"></textarea>
      <button class="btn-primary" onclick="window.sendPesan()">Kirim</button>
    </div>
    <div class="section-title">Riwayat Pesan Terkirim (${msgs.length})</div>
    ${msgs.slice(0,30).map(m=>`<div class="prem-item"><span>${m.toEmail}<br><span style="color:var(--dim); font-weight:400;">${m.text}</span></span>
      <button class="btn-danger" onclick="window.deletePesan('${m.id}')">Hapus</button></div>`).join('') || '<p style="color:var(--dim);">Belum ada pesan terkirim.</p>'}
  `;
}
window.sendPesan = async () => {
  const email = document.getElementById('pesanEmail').value.trim().toLowerCase();
  const text = document.getElementById('pesanText').value.trim();
  if(!email || !email.includes('@') || !text){ alert('Lengkapi email dan isi pesan.'); return; }
  await addDoc(collection(db,'messages'), { toEmail: email, text, createdAt: Date.now(), read:false });
  document.getElementById('pesanEmail').value=''; document.getElementById('pesanText').value='';
  alert('Pesan terkirim.');
};
window.deletePesan = async (id) => { await deleteDoc(doc(db,'messages', id)); };

window.addPremium = async () => {
  const input = document.getElementById('premInput');
  const daysInput = document.getElementById('premDaysInput');
  const email = input.value.trim().toLowerCase();
  const days = parseInt(daysInput.value);
  if(!email || !email.includes('@')){ alert('Masukkan email yang valid.'); return; }
  const payload = { addedAt: Date.now(), source:'manual' };
  if(days) payload.expiresAt = Date.now() + days*86400000;
  await setDoc(doc(db,'premiumUsers', email), payload);
  input.value = ''; daysInput.value = '';
};
window.removePremium = async (email) => {
  if(confirm('Cabut status premium dari '+email+'?')) await deleteDoc(doc(db,'premiumUsers', email));
};
</script>
</body>
</html>
