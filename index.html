<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrupAI — Direktori Grup AI Terbaik</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0C1416; --surface:#121D20; --line:#233335; --text:#E7F1F1; --dim:#8FAAAC; --teal:#38E1C6; --amber:#F2B84B; }
  *{box-sizing:border-box;} body{margin:0; background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;}
  header{display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; gap:10px;}
  .logo{font-family:'Sora',sans-serif; font-weight:700; font-size:1.2rem;}
  .logo span{color:var(--teal);}
  button{font-family:'Inter',sans-serif; cursor:pointer; border:none; border-radius:8px;}
  .btn-primary{background:var(--teal); color:#04211B; font-weight:600; padding:10px 16px;}
  .btn-ghost{background:transparent; color:var(--text); border:1px solid var(--line); padding:10px 16px;}
  .user-box{display:flex; align-items:center; gap:10px; font-size:.8rem; color:var(--dim);}
  main{max-width:960px; margin:0 auto; padding:20px;}
  .section-title{font-family:'JetBrains Mono',monospace; font-size:.72rem; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; margin:24px 0 10px;}
  .top-row{display:flex; gap:12px; overflow-x:auto;}
  .top-card{min-width:190px; background:var(--surface); border:1px solid var(--amber); border-radius:10px; padding:14px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px;}
  .card img{width:100%; aspect-ratio:1.6; object-fit:cover; border-radius:6px; margin-bottom:8px; background:#000;}
  .tag{display:inline-block; font-family:'JetBrains Mono',monospace; font-size:.63rem; color:var(--teal); margin-bottom:5px;}
  .card h3{font-family:'Sora',sans-serif; font-size:.92rem; margin:0 0 5px;}
  .card p{color:var(--dim); font-size:.78rem; margin:0 0 8px;}
  .join-btn{display:block; width:100%; text-align:center; background:var(--teal); color:#04211B; font-weight:600; padding:8px; text-decoration:none; font-size:.82rem; border-radius:6px;}
  .overlay{position:fixed; inset:0; background:rgba(6,10,11,.8); display:none; align-items:center; justify-content:center; padding:16px; z-index:10;}
  .overlay.show{display:flex;}
  .modal{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px; width:100%; max-width:380px; max-height:88vh; overflow-y:auto;}
  .modal h2{font-family:'Sora',sans-serif; font-size:1.05rem; margin:0 0 4px;}
  .modal label{display:block; font-size:.78rem; color:var(--dim); margin:10px 0 5px;}
  .modal input, .modal select, .modal textarea{width:100%; padding:8px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--text); font-family:'Inter',sans-serif;}
  .checkbox{display:flex; gap:8px; align-items:flex-start; margin-top:12px; font-size:.75rem; color:var(--dim);}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .notice{font-family:'JetBrains Mono',monospace; font-size:.65rem; color:var(--dim); background:var(--bg); border:1px dashed var(--line); border-radius:6px; padding:9px; margin-top:12px;}
  .spinner{font-family:'JetBrains Mono',monospace; font-size:.8rem; color:var(--teal); text-align:center; padding:8px;}
</style>
</head>
<body>

<header>
  <div class="logo">Grup<span>AI</span></div>
  <div id="authArea" class="user-box"></div>
</header>

<main>
  <div class="section-title">🏆 Top Grup</div>
  <div class="top-row" id="topRow"><div class="spinner">Memuat...</div></div>

  <div class="section-title">Semua Grup</div>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="uploadOverlay">
  <div class="modal">
    <h2>Tambah Grup</h2>
    <label>Nama Grup</label><input id="fTitle" placeholder="Contoh: Belajar Prompting AI">
    <label>Platform</label>
    <select id="fPlatform"><option>WhatsApp</option><option>Telegram</option></select>
    <label>Kategori</label>
    <select id="fCat"><option>Diskusi AI</option><option>Belajar & Tutorial</option><option>Tools & Produktivitas</option><option>Lainnya</option></select>
    <label>Deskripsi Singkat</label><textarea id="fDesc" rows="2"></textarea>
    <label>Link Undangan Grup</label><input id="fLink" placeholder="https://chat.whatsapp.com/...">
    <label>Gambar Grup (opsional)</label><input id="fImg" type="file" accept="image/*">
    <div class="checkbox">
      <input type="checkbox" id="fConfirm" style="width:auto;">
      <label style="margin:0;" for="fConfirm">Saya konfirmasi grup ini bukan konten 18+/dewasa, judi, atau ilegal. Grup akan ditinjau admin sebelum tampil publik.</label>
    </div>
    <div id="uploadStatus" class="spinner" style="display:none;"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeUpload()" style="flex:1">Batal</button>
      <button class="btn-primary" id="submitBtn" onclick="submitUpload()" style="flex:1">Kirim</button>
    </div>
  </div>
</div>

<div class="overlay" id="blockOverlay">
  <div class="modal">
    <h2>Kuota gratis habis</h2>
    <p style="color:var(--dim); font-size:.85rem;">Kamu sudah pakai jatah upload gratis. Upload berikutnya bayar Rp10.000.</p>
    <div class="modal-actions"><button class="btn-primary" onclick="fakePay()" style="flex:1">Bayar Rp10rb</button></div>
    <div class="notice">Demo: pembayaran disimulasikan. Di versi live, sambungkan payment gateway asli (Midtrans/Xendit).</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, where, orderBy, onSnapshot, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDabShBKh-VO0nFtyjeiQuMUZ7-YScrajc",
  authDomain: "itemdrop-marketplace.firebaseapp.com",
  projectId: "itemdrop-marketplace",
  storageBucket: "itemdrop-marketplace.firebasestorage.app",
  messagingSenderId: "1019572855068",
  appId: "1:1019572855068:web:ef886624def992fbcd1ad9"
};
const IMGBB_KEY = "65681fd261ad61bee7b1c53a43fbfb28";
const BANNED = ['18+','dewasa','porn','bokep','judi','slot gacor','narkoba'];

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let currentUser = null;

const authArea = document.getElementById('authArea');
function renderAuth(){
  if(currentUser){
    authArea.innerHTML = `<span>${currentUser.displayName}</span>
      <button class="btn-primary" onclick="window.openUpload()">+ Tambah Grup</button>
      <button class="btn-ghost" onclick="window.doLogout()">Keluar</button>`;
  } else {
    authArea.innerHTML = `<button class="btn-primary" onclick="window.doLogin()">Login dengan Google</button>`;
  }
}
onAuthStateChanged(auth, user => { currentUser = user; renderAuth(); });

window.doLogin = () => signInWithPopup(auth, new GoogleAuthProvider()).catch(e=>alert('Login gagal: '+e.message));
window.doLogout = () => signOut(auth);

const q = query(collection(db,'groups'), where('reviewed','==',true), orderBy('rating','desc'));
onSnapshot(q, snap => {
  const groups = snap.docs.map(d=>d.data());
  document.getElementById('topRow').innerHTML = groups.slice(0,3).map((g,i)=>`
    <div class="top-card"><div style="font-family:'JetBrains Mono',monospace; font-size:.65rem; color:var(--amber);">#${i+1}</div>
    <h3 style="font-family:'Sora',sans-serif; font-size:.88rem; margin:6px 0;">${g.title}</h3>
    <div style="color:var(--amber); font-family:'JetBrains Mono',monospace; font-size:.78rem;">★ ${(g.rating||0).toFixed(1)}</div></div>`).join('') || '<div class="spinner">Belum ada grup disetujui.</div>';

  document.getElementById('grid').innerHTML = groups.map(g=>`
    <div class="card">
      ${g.imageUrl ? `<img src="${g.imageUrl}">` : ''}
      <span class="tag">${g.platform} · ${g.category}</span>
      <h3>${g.title}</h3><p>${g.desc||''}</p>
      <a class="join-btn" target="_blank" href="${g.link}">Gabung Grup</a>
    </div>`).join('') || '<p style="color:var(--dim);">Belum ada grup yang disetujui admin.</p>';
}, err => { document.getElementById('grid').innerHTML = '<p style="color:var(--dim);">Gagal memuat: '+err.message+'</p>'; });

window.openUpload = () => {
  if(!currentUser){ alert('Login dulu pakai Google.'); return; }
  document.getElementById('uploadOverlay').classList.add('show');
};
window.closeUpload = () => document.getElementById('uploadOverlay').classList.remove('show');

async function uploadImageIfAny(){
  const file = document.getElementById('fImg').files[0];
  if(!file) return '';
  const fd = new FormData();
  fd.append('image', file);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method:'POST', body: fd });
  const data = await res.json();
  if(!data.success) throw new Error('Upload gambar gagal');
  return data.data.url;
}

window.submitUpload = async () => {
  const title = document.getElementById('fTitle').value.trim();
  const platform = document.getElementById('fPlatform').value;
  const category = document.getElementById('fCat').value;
  const desc = document.getElementById('fDesc').value.trim();
  const link = document.getElementById('fLink').value.trim();
  const confirmed = document.getElementById('fConfirm').checked;
  if(!title || !link){ alert('Lengkapi nama grup dan link undangan.'); return; }
  if(!confirmed){ alert('Centang dulu konfirmasi kontennya.'); return; }
  const combined = (title+' '+desc).toLowerCase();
  if(BANNED.some(w=>combined.includes(w))){ alert('Grup ditolak: terdeteksi kata yang dilarang.'); return; }

  const userRef = doc(db,'users',currentUser.uid);
  const userSnap = await getDoc(userRef);
  const freeUsed = userSnap.exists() ? (userSnap.data().freeUploadsUsed||0) : 0;

  if(freeUsed >= 1){
    document.getElementById('blockOverlay').classList.add('show');
    return;
  }
  await doUpload(title, platform, category, desc, link, userRef, freeUsed);
};

async function doUpload(title, platform, category, desc, link, userRef, freeUsed){
  const statusEl = document.getElementById('uploadStatus');
  statusEl.style.display='block'; statusEl.textContent='Mengunggah gambar...';
  document.getElementById('submitBtn').disabled = true;
  try{
    const imageUrl = await uploadImageIfAny();
    statusEl.textContent = 'Menyimpan grup...';
    await addDoc(collection(db,'groups'), {
      title, platform, category, desc, link, imageUrl,
      ownerId: currentUser.uid, reviewed:false, rating:0, votes:0, createdAt: Date.now()
    });
    await setDoc(userRef, { freeUploadsUsed: freeUsed+1 }, { merge:true });
    alert('Grup berhasil dikirim! Menunggu review admin sebelum tampil publik.');
    closeUpload();
  }catch(e){ alert('Gagal: '+e.message); }
  statusEl.style.display='none';
  document.getElementById('submitBtn').disabled = false;
}

window.fakePay = async () => {
  document.getElementById('blockOverlay').classList.remove('show');
  const title = document.getElementById('fTitle').value.trim();
  const platform = document.getElementById('fPlatform').value;
  const category = document.getElementById('fCat').value;
  const desc = document.getElementById('fDesc').value.trim();
  const link = document.getElementById('fLink').value.trim();
  const userRef = doc(db,'users',currentUser.uid);
  const userSnap = await getDoc(userRef);
  const freeUsed = userSnap.exists() ? (userSnap.data().freeUploadsUsed||0) : 0;
  await doUpload(title, platform, category, desc, link, userRef, freeUsed);
};
</script>
</body>
</html>
